name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a newer push to the same branch / PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22' # server/package-lock.json: wrangler / miniflare declare engines node >=22

jobs:
  checks:
    name: checks (regen, whitespace, motor==vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the sources the checks read; the 2 GB models/ tree is not needed here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            work
            vendor
            audio
            server/src
            models/valorant/movement
      - name: index.html is the regen output (work/install_valorant.py)
        run: |
          python3 work/install_valorant.py
          git diff --exit-code index.html
      - name: no whitespace errors against the parent commit
        run: git diff --check HEAD^ HEAD
      - name: server motor == vendored client copy
        run: cmp server/src/motor.cjs vendor/valorant-feel.js

  server:
    name: server (npm test)
    runs-on: ubuntu-latest
    # 45: test-spawn-barrier-leaks.js (escape / reach / ledge runs at every spawn wall, all six maps) grew with the sky walls.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      # server/public (gitignored) is built by `npm run build:worlds` from models/valorant/maps; only public/worlds is read by tests.
      - name: cache built worlds
        id: worlds
        uses: actions/cache@v4
        with:
          path: server/public
          key: worlds-${{ hashFiles('server/build-all.cjs', 'server/build-world.cjs', 'server/package-lock.json', 'models/valorant/maps/*/collision.bin', 'models/valorant/maps/*/collision-patch.bin', 'models/valorant/maps/*/collision-exclude.bin', 'models/valorant/maps/*/navigation.json', 'models/valorant/maps/*/map.json', 'models/valorant/maps/*/plants.json') }}
      - name: build worlds
        if: steps.worlds.outputs.cache-hit != 'true'
        run: npm run build:worlds
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    name: client (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 45: work/test_spawn_barrier_tall_client.cjs (page-motor ledge / ability runs at every spawn wall, all six maps) adds
    # ~10-25 min to whichever shard it lands in (shard 1 of 4 today; ~28 min on the loaded 2-core dev box).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Client tests load three / three-mesh-bvh / ws from server/node_modules.
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: cache built worlds
        id: worlds
        uses: actions/cache@v4
        with:
          path: server/public
          key: worlds-${{ hashFiles('server/build-all.cjs', 'server/build-world.cjs', 'server/package-lock.json', 'models/valorant/maps/*/collision.bin', 'models/valorant/maps/*/collision-patch.bin', 'models/valorant/maps/*/collision-exclude.bin', 'models/valorant/maps/*/navigation.json', 'models/valorant/maps/*/map.json', 'models/valorant/maps/*/plants.json') }}
      - name: build worlds
        if: steps.worlds.outputs.cache-hit != 'true'
        run: npm run build:worlds
        working-directory: server
      # work/page_harness.cjs real3 boots the page on three r149 + the r147 GLTFLoader / SkeletonUtils, the exact files
      # index.html loads, from REAL3_DIR; without them it falls back to server/node_modules three r160 and the bot sims
      # diverge (test_round_start_perf, test_bot_play_offline).
      - name: three.js files the page loads (REAL3_DIR for the real3 harness)
        run: |
          d="$RUNNER_TEMP/three-real3"; mkdir -p "$d"; cd "$d"
          curl -fsSL --retry 3 -o three.min.js https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js
          curl -fsSL --retry 3 -o GLTFLoader.js https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js
          curl -fsSL --retry 3 -o SkeletonUtils.js https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js
          sha256sum -c - <<'SUMS'
          8a5f7249903b54d30f79f708699d2fed2d6a1d0741a4cd41377d1f01bb5a2271  three.min.js
          b2edda923572c73e6b30b139756d182c87e2c34d022845c6e067a9a0a9544e01  GLTFLoader.js
          ad2dc432b0e10ea30b19dca3dfcd8c03a5c4d6284e6c691f0c6f1b45a70c3b0d  SkeletonUtils.js
          SUMS
          echo "REAL3_DIR=$d" >> "$GITHUB_ENV"
      - name: client regressions (work/test_all.cjs, shard ${{ matrix.shard }} of 4)
        env:
          SHARD_TOTAL: '4'
          SHARD_INDEX: ${{ matrix.shard }}
          QA_PERF_RETRY: '1' # test_round_start_perf / test_frame_perf only: one rerun after a wall-clock failure
        run: |
          QA_LIST=1 node ../work/test_all.cjs
          npm run test:client
        working-directory: server
