<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio and finisher acceptance</title>
<style>body{height:100vh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:#101923;color:#eee;font:13px system-ui}header{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}button{padding:9px 13px;background:#263441;color:white;border:1px solid #65737d;cursor:pointer}button:hover{background:#425665}output{font-variant-numeric:tabular-nums}iframe{display:block;border:0;width:100%;flex:1;min-height:0}</style>
<header><button id="range">Start range</button><button id="five">Start 5v5</button><button id="sound">Sound on/off</button><button id="prime">Prime wolf</button><button id="blastx">BlastX gift</button><button id="final">Last-enemy trigger check</button><button id="fire">Play held gun audio</button><button id="clear">Clear effects</button><output id="status">Loading game…</output></header><iframe id="game" src="../index.html" title="Actual game runtime"></iframe>
<script>
const errors=[];addEventListener('error',e=>errors.push(e.message));const frame=document.getElementById('game'),out=document.getElementById('status');frame.addEventListener('load',()=>frame.contentWindow.addEventListener('error',e=>errors.push(e.message)));function game(){const f=frame.contentWindow;if(!f.xSkinFinishers||!f.__vs)throw Error('Open this acceptance page on localhost after the game loads.');return f;}
function button(id,fn){document.getElementById(id).onclick=()=>{try{fn(game());}catch(e){out.textContent=e.message;}};}
button('range',f=>{f.document.querySelector('#intro button')?.click();f.__vs.startAim();const tick=setInterval(()=>{if(f.__vs.state().mode==='aim'&&!f.xLdOn){if(f.__vs.rangeDrill('spray'))clearInterval(tick);}},100);});button('five',f=>{f.__vs.startFive();});button('sound',f=>{f.document.getElementById('sndBtn').click();f.xGameAudio.unlock();});
function preview(f,c){const w=c==='prime'?'Vandal':'Phantom';f.xValorantSkins.give(w,c);f.xValorantSkins.equip(w,c);const a=f.xValorantAssets,d=new f.THREE.Vector3();a.camera.getWorldDirection(d);const p=a.camera.position.clone().addScaledVector(d,5);p.y=f.__vs.player.y||0;f.xSkinFinishers.play(w,c,p,null,'preview:'+Date.now());const slot=f.xSkinFinishers.state.pool.find(s=>s.active&&s.type===c);if(slot)slot.start-=650;}
button('prime',f=>preview(f,'prime'));button('blastx',f=>preview(f,'blastx'));button('clear',f=>f.xSkinFinishers.clear());button('fire',f=>{const key=f.xGameAudio.weapon('Vandal','fire');f.xGameAudio.play(key,'gun');});
button('final',f=>{const units=f.__vs.bots.filter(u=>u.alive);if(!units.length)throw Error('Start 5v5 first.');for(const u of [...f.__vs.bots,...f.__vs.allies])u.nt=true;f.__vs.player.hp=1000;const last=units.pop(),w='Vandal';f.xValorantSkins.give(w,'prime');f.xValorantSkins.equip(w,'prime');for(const u of units)f.__vs.kill(u,false,'Teammate',w);const p=last.g.position;f.__vs.setPos(p.x,p.y,p.z+5);f.__vs.aimAt(p.x,p.y+1.3,p.z);f.__vs.kill(last,false,'You',w);});
setInterval(()=>{try{const f=game(),s=f.xSkinFinishers.state,a=f.xGameAudio.state;out.textContent=(f.xGameAudio.isMuted()?'Muted':'Sound on')+' · FX '+s.played+' / active '+s.pool.filter(p=>p.active).length+' · audio '+a.plays+' · voices '+a.slots.filter(s=>s.source).length+' · decoded '+(a.bytes/1048576).toFixed(1)+' MB · errors '+(Object.keys(a.errors).length+errors.length)+' · '+(a.unlockedContext?.state||'locked')+' · '+(a.lastKey||'');}catch(e){}},150);
</script></html>
