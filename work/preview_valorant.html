<!doctype html><style>body{margin:0;background:#17202b;color:white;font:14px Arial}canvas{display:block}#info{position:absolute;top:12px;left:12px}</style><div id="info"></div><script src="/work/qa/three.min.js"></script><script src="/work/qa/GLTFLoader.js"></script><script src="/work/qa/SkeletonUtils.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#303d4e');const camera=new THREE.PerspectiveCamera(45,1200/700,.01,100);camera.position.set(0,1,4);camera.lookAt(0,1,0);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(1200,700);r.outputEncoding=THREE.sRGBEncoding;document.body.append(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x718297,1.3));let sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(3,5,5);scene.add(sun);const L=new THREE.GLTFLoader();window.load=async function(name,clip){const g=await L.loadAsync('/valorstrike/models/valorant/'+name+'.glb');scene.add(g.scene);window.g=g;window.mx=new THREE.AnimationMixer(g.scene);if(clip){let clips=await fetch('/valorstrike/models/valorant/'+name+'-locomotion.json').then(r=>r.json());mx.clipAction(THREE.AnimationClip.parse(clips.find(c=>c.name===clip))).play();mx.update(.1);}document.getElementById('info').textContent=name;return g.animations.map(c=>c.name);};function tick(){requestAnimationFrame(tick);r.render(scene,camera);}tick();window.ready=true;
</script>
